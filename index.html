<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gry Jagienki</title>
  <meta name="description" content="Gry i aplikacje zrobione przez Jagienkę.">
  <style>
    :root {
      --bg: #fff8ec;
      --card: #ffffff;
      --text: #2b2340;
      --muted: #6b6280;
      --accent: #d6409f;
      --accent-2: #8b5cf6;
      --border: #f0e2c8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17142a;
        --card: #221d3b;
        --text: #f3eefc;
        --muted: #a9a0c2;
        --accent: #f06bbd;
        --accent-2: #a78bfa;
        --border: #352d57;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main { max-width: 860px; margin: 0 auto; padding: 48px 16px 64px; }
    h1 { font-size: clamp(2.2rem, 7vw, 3.6rem); margin: 0 0 8px; letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }
    .lead { color: var(--muted); font-size: 1.15rem; margin: 0 0 40px; }
    .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .card {
      display: block;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      color: inherit;
      text-decoration: none;
      transition: transform .15s, border-color .15s;
    }
    a.card:hover { transform: translateY(-3px); border-color: var(--accent-2); }
    .card img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; object-fit: cover; }
    .card .body { padding: 16px 20px 20px; }
    .card h2 { margin: 0 0 4px; font-size: 1.25rem; }
    .card p { margin: 0; color: var(--muted); }
    .card .play {
      display: inline-block;
      margin-top: 14px;
      padding: 8px 18px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }
    .card .emoji { font-size: 2.2rem; }
    .empty { border-style: dashed; text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>Gry <span>Jagienki</span></h1>
    <p class="lead">Gry i aplikacje zrobione przez Jagienkę.</p>

    <!-- Każda gra lub aplikacja to osobny folder z plikiem gry i zrzutem ekranu (screenshot.jpg).
         Nowa gra = skopiuj kartę poniżej i podmień link, obrazek, tytuł i opis. -->
    <section class="grid">
      <a class="card" href="gra1-moda/">
        <img src="gra1-moda/screenshot.jpg" alt="Studio Mody – czarownica z kotem w pracowni z eliksirami" width="1280" height="800">
        <div class="body">
          <h2>Studio Mody 👗</h2>
          <p>Stwórz własną postać: fryzury, makijaż, setki strojów i przebrania na Halloween. Zapisz ją i pobierz jako obrazek!</p>
          <span class="play">Graj</span>
        </div>
      </a>
      <div class="card empty">
        <div class="body">
          <div class="emoji">🛠️</div>
          <h2>Wkrótce</h2>
          <p>Tu pojawią się kolejne gry i aplikacje.</p>
        </div>
      </div>
    </section>

  </main>
</body>
</html>
